<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Butlr</title>
    <link rel="stylesheet" href="/assets/app.css" />
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <div>
          <h1>Butlr</h1>
          <p class="subtitle">
            Triage Gmail tasks, review deadlines, and work from one focused view.
          </p>
        </div>
        <div class="topbar-actions">
          <div class="countdown-card" aria-live="polite">
            <div class="countdown-ring" aria-hidden="true">
              <svg viewBox="0 0 48 48" class="countdown-svg">
                <circle class="countdown-track" cx="24" cy="24" r="20"></circle>
                <circle id="countdownProgress" class="countdown-progress" cx="24" cy="24" r="20"></circle>
              </svg>
              <span id="countdownValue" class="countdown-value">--</span>
            </div>
            <div class="countdown-copy">
              <p class="countdown-label">Next process</p>
              <p id="countdownText" class="countdown-text">Waiting for schedule</p>
              <p id="lastRunLabel" class="last-run-label" hidden></p>
            </div>
          </div>
          <button id="runNowButton" class="button button-secondary" type="button">
            Run Now
          </button>
          <button id="disconnectButton" class="button button-tertiary" type="button">
            Disconnect
          </button>
        </div>
      </header>

      <section id="statusBanner" class="status-banner" hidden></section>

      <main id="app" class="app" hidden>
        <section id="lanes" class="lanes"></section>
      </main>

      <section id="emptyState" class="empty-state" hidden></section>

      <section id="authPrompt" class="auth-prompt" hidden>
        <div class="auth-card">
          <p class="eyebrow">Authentication</p>
          <h2>Connect Gmail to continue</h2>
          <p>
            Butlr reads your Gmail inbox through the backend OAuth flow and
            shows extracted tasks here.
          </p>
          <a class="button button-primary" href="/auth/login">Connect Gmail</a>
        </div>
      </section>
    </div>

    <dialog id="taskDialog" class="dialog">
      <article class="dialog-card">
        <header class="dialog-header">
          <div class="dialog-header-copy">
            <p id="dialogPriority" class="eyebrow dialog-priority"></p>
            <h2 id="dialogTitle"></h2>
          </div>
          <button id="closeDialogButton" class="icon-button" type="button" aria-label="Close">
            ×
          </button>
        </header>
        <div class="dialog-meta">
          <span id="dialogSource" class="chip"></span>
          <span id="dialogDeadline" class="chip chip-deadline" hidden></span>
        </div>
        <section class="dialog-section">
          <div class="section-heading">
            <h3>Summary</h3>
          </div>
          <div class="dialog-panel">
            <p id="dialogSummary" class="dialog-copy"></p>
          </div>
        </section>
        <section id="draftSection" class="dialog-section" hidden>
          <div class="section-heading">
            <h3>Suggested Reply</h3>
            <button id="copyDraftButton" class="button button-secondary button-small" type="button">
              Copy
            </button>
          </div>
          <div class="dialog-panel">
            <p id="dialogDraftSubject" class="draft-subject"></p>
            <pre id="dialogDraft" class="draft-block"></pre>
          </div>
        </section>
        <footer class="dialog-footer">
          <button id="dialogCloseAction" class="button button-secondary" type="button">
            Close
          </button>
        </footer>
      </article>
    </dialog>

    <template id="laneTemplate">
      <section class="lane">
        <div class="lane-header">
          <div>
            <h2 class="lane-title"></h2>
            <p class="lane-caption"></p>
          </div>
          <div class="lane-controls">
            <button class="icon-button lane-prev" type="button" aria-label="Previous page">←</button>
            <button class="icon-button lane-next" type="button" aria-label="Next page">→</button>
          </div>
        </div>
        <div class="lane-cards"></div>
      </section>
    </template>

    <template id="cardTemplate">
      <button class="task-card" type="button">
        <h3 class="task-title"></h3>
        <p class="task-summary"></p>
        <footer class="task-footer">
          <span class="chip task-source"></span>
          <span class="chip task-priority-chip"></span>
        </footer>
      </button>
    </template>

    <script src="/assets/app.js" defer></script>
  </body>
</html>
